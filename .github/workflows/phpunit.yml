
name: AgroCloud - PHPUnit Neon

on:
  push:
    branches:
      - main
      - feature/ilan
  workflow_dispatch:

permissions:
  contents: read

# Evita ejecutar pruebas simultáneas
# contra la misma base testing.
concurrency:
  group: agrocloud-neon-testing
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    env:
      APP_ENV: testing
      APP_DEBUG: true

      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      DB_SSLMODE: require

      NEON_TEST_HOST: ${{ vars.NEON_TEST_HOST }}
      NEON_PROD_HOST: ${{ vars.NEON_PROD_HOST }}
      NEON_TEST_DATABASE: ${{ vars.NEON_TEST_DATABASE }}
      NEON_TEST_USER: ${{ vars.NEON_TEST_USER }}

      AGROCLOUD_ALLOW_PG_TESTS: "1"

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: "null"

    steps:
      - name: Descargar AgroCloud
        uses: actions/checkout@v4

      
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, dom, zip, gd, intl
          coverage: none


      - name: Verificar base Neon de pruebas
        run: |
          php -r '
          $url = getenv("DB_URL");
          $host = $url ? parse_url($url, PHP_URL_HOST) : false;
          $test = getenv("NEON_TEST_HOST");
          $prod = getenv("NEON_PROD_HOST");

          if (!$host || !$test || !$prod ||
              $host !== $test || $host === $prod) {
              fwrite(STDERR, "Base de pruebas no verificada.\n");
              exit(1);
          }

          echo "Host de testing verificado.\n";
          '

      - name: Instalar dependencias Laravel
        run: composer install --no-interaction --prefer-dist

      - name: Preparar Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar frontend
        run: |
          npm ci
          npm run build

      # SOLO sobre la rama Neon testing.
      # Elimina todas las tablas de esa base.
      - name: Preparar datos de pruebas
        run: |
          php scripts/qa/verificar_bd.php
          php artisan migrate:fresh --seed --force -vvv

      - name: Generar directorio de reportes
        run: mkdir -p reports

      - name: Ejecutar PHPUnit
        run: |
          ./vendor/bin/phpunit \
            --log-junit reports/junit.xml \
            --testdox-html reports/pruebas.html

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrocloud-phpunit-reportes
          path: reports/
          if-no-files-found: warn

